name: Bug report
description: Report a crash, visual glitch or broken quest behaviour.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill every field — it saves a round trip.
        For crashes, attach the full `crash-reports/crash-*.txt` or `logs/latest.log`.
  - type: input
    id: mod-version
    attributes:
      label: StoryQuest version
      description: File name from `mods/`, e.g. `storyquest-1.3.0-beta.3.jar`.
      placeholder: storyquest-1.2.0.jar
    validations:
      required: true
  - type: input
    id: minecraft
    attributes:
      label: Minecraft and NeoForge version
      placeholder: Minecraft 1.21.1, NeoForge 21.1.264
    validations:
      required: true
  - type: dropdown
    id: side
    attributes:
      label: Where does it happen?
      options:
        - Singleplayer
        - Dedicated server (client + server)
        - Dedicated server, client only
        - Client only
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press J
        2. Switch theme to Book
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Screenshots are welcome; drag them into this field.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: Paste the relevant part or a link to a gist.
      render: text
    validations:
      required: false
  - type: input
    id: modpack
    attributes:
      label: Modpack or other mods
      description: Optional, but helps with mod conflicts.
    validations:
      required: false
